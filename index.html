<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>整形外科クイズ</title>

    <style>
        body {
            font-family: sans-serif;
            background: #667eea;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
        }

        .choice {
            padding: 10px;
            margin: 8px 0;
            border: 2px solid #ccc;
            border-radius: 8px;
            cursor: pointer;
        }

        .selected {
            background: #667eea;
            color: white;
        }

        .correct {
            background: #28a745;
            color: white;
        }

        .incorrect {
            background: #dc3545;
            color: white;
        }

        .missed {
            background: #6c757d;
            color: white;
        }

        #actionBtn {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            border: 3px solid #667eea;
            border-radius: 8px;
            background: #667eea;
            color: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        #actionBtn:hover:not(:disabled) {
            background: #5568d3;
            border-color: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        #actionBtn:disabled {
            background: #ccc;
            border-color: #ccc;
            cursor: not-allowed;
            opacity: 0.6;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2 id="progress"></h2>
        <h3 id="body"></h3>
        <p id="symptom"></p>

        <div id="choices"></div>

        <button id="actionBtn" onclick="handleAction()" disabled>回答</button>
        
        <div id="result" style="display:none; margin-top: 20px; text-align: center;">
            <h2 id="resultText"></h2>
            <button onclick="restart()" style="padding: 10px 20px; font-size: 16px; cursor: pointer;">もう一度チャレンジ</button>
        </div>
    </div>

    <script>

        const quizData = [

            { part: "首", symptom: "前屈時痛", answers: ["筋筋膜症", "頚椎椎間板症"] },
            { part: "首", symptom: "後屈時痛", answers: ["筋筋膜症", "頚椎椎間板症", "椎間孔狭窄", "頚椎椎間関節炎", "ルシュカ関節炎", "頚椎すべり症"] },
            { part: "首", symptom: "回旋時痛", answers: ["筋筋膜症", "椎間孔狭窄", "頚椎椎間関節炎", "ルシュカ関節炎", "頚椎すべり症"] },
            { part: "首", symptom: "上肢への放散痛・しびれ", answers: ["頚椎椎間板症", "椎間孔狭窄", "胸郭出口症候群"] },
            { part: "首", symptom: "頭から腕への放散", answers: ["椎間孔狭窄"] },
            { part: "首", symptom: "極度の可動域低下", answers: ["頚椎捻挫", "頚椎椎間板症", "OPLL"] },
            { part: "首", symptom: "肩甲間部のコリ", answers: ["頚椎椎間板症", "筋筋膜症"] },
            { part: "首", symptom: "頭上挙上で症状悪化", answers: ["椎間板障害"] },
            { part: "首", symptom: "棘突起圧痛", answers: ["椎間板障害"] },
            { part: "首", symptom: "腕挙上で症状出現", answers: ["胸郭出口症候群"] },
            { part: "首", symptom: "アドソンテスト陽性", answers: ["胸郭出口症候群"] },
            { part: "首", symptom: "ライトテスト陽性", answers: ["胸郭出口症候群"] },
            { part: "腰", symptom: "前屈時痛", answers: ["椎間板症（ヘルニア）", "腰椎挫傷", "筋筋膜症"] },
            { part: "腰", symptom: "後屈時痛", answers: ["分離症", "すべり症", "脊柱管狭窄症", "椎間関節症", "椎間板症（ヘルニア）"] },
            { part: "腰", symptom: "回旋時痛", answers: ["筋筋膜症", "椎間関節症", "分離症"] },
            { part: "腰", symptom: "仙腸関節の痛み", answers: ["椎間板症（ヘルニア）", "仙腸関節可動域低下"] },
            { part: "腰", symptom: "下肢への放散痛", answers: ["ヘルニア", "梨状筋症候群", "脊柱管狭窄症"] },
            { part: "腰", symptom: "歩行時痛", answers: ["筋筋膜症", "脊柱管狭窄症", "椎間関節症", "分離症", "すべり症"] },
            { part: "腰", symptom: "尾骨の痛み", answers: ["外傷性", "ヘルニア"] },
            { part: "腰", symptom: "股関節屈曲位回旋で痛み", answers: ["脊柱管狭窄症", "分離症", "すべり症"] },
            { part: "腰", symptom: "腰椎伸展位回旋で痛み", answers: ["ヘルニア"] },
            { part: "腰", symptom: "腰椎伸展可動域低下", answers: ["脊柱管狭窄症"] },
            { part: "腰", symptom: "SLR 0〜35°で痛み", answers: ["重度ヘルニア", "神経根障害"] },
            { part: "腰", symptom: "SLR 35〜70°で痛み", answers: ["ヘルニア"] },
            { part: "腰", symptom: "SLR 70°以上で痛み", answers: ["椎間関節症", "仙腸関節障害"] },
            { part: "腰", symptom: "ケンプテスト同側痛", answers: ["椎間関節症"] },
            { part: "腰", symptom: "ケンプテスト反対側痛", answers: ["椎間板障害"] },
            { part: "腰", symptom: "棘突起圧痛", answers: ["椎間板障害"] },
            { part: "腰", symptom: "筋力低下（膝伸展・足背屈）", answers: ["ヘルニア"] },
            { part: "腰", symptom: "知覚異常（腰〜下肢）", answers: ["ヘルニア", "神経障害"] },
            { part: "膝", symptom: "歩行時・荷重時痛", answers: ["変形性膝関節症", "半月板障害", "鵞足炎"] },
            { part: "膝", symptom: "ジャンプ着地時の痛み", answers: ["半月板障害", "前十字靭帯損傷"] },
            { part: "膝", symptom: "膝後部の痛み", answers: ["後十字靭帯損傷", "半月板障害", "腰椎椎間板症"] },
            { part: "膝", symptom: "膝内側の痛み", answers: ["変形性膝関節症", "半月板障害（内側）", "鵞足炎", "内側側副靭帯損傷"] },
            { part: "膝", symptom: "膝外側の痛み", answers: ["変形性膝関節症", "半月板障害（外側）", "外側側副靭帯損傷"] },
            { part: "膝", symptom: "膝蓋骨周囲の痛み", answers: ["オスグッドシュラッター病", "膝蓋大腿関節症", "膝蓋骨脱臼", "タナ障害"] },
            { part: "膝", symptom: "PFジャンプテスト", answers: ["膝蓋軟骨症", "ジャンパー膝", "分裂膝蓋骨"] },
            { part: "膝", symptom: "FTテスト", answers: ["変形性膝関節症", "半月板障害", "腸脛靭帯炎", "鵞足炎"] },
            { part: "膝", symptom: "マクマレーテスト", answers: ["内側半月板", "外側半月板"] },
            { part: "肩", symptom: "回内＞回外", answers: ["広背筋短縮"] },
            { part: "肩", symptom: "回外＞回内", answers: ["インピンジメント症候群", "二頭筋長頭腱炎", "棘上筋障害", "三角筋下滑液包炎"] },
            { part: "肩", symptom: "回内＝回外", answers: ["腱板炎", "腱板部分断裂", "滑液包炎", "拘縮性肩関節炎"] },
            { part: "肩", symptom: "他動＞自動", answers: ["インピンジメント症候群", "二頭筋長頭腱炎", "棘上筋障害", "三角筋下滑液包炎"] },
            { part: "肩", symptom: "他動＝自動", answers: ["腱板炎", "滑液包炎", "拘縮性肩関節炎"] },
            { part: "肩", symptom: "エンドフィールあり", answers: ["拘縮性肩関節炎"] },
            { part: "肩", symptom: "エンドフィールなし", answers: ["腱板炎", "滑液包炎"] },
            { part: "肩", symptom: "投球動作痛", answers: ["インピンジメント症候群", "関節唇損傷", "腱板炎", "腱板部分断裂"] },
            { part: "肩", symptom: "ROM内で痛み(ペインフルアーク)", answers: ["インピンジメント症候群", "腱板炎", "滑液包炎"] },
            { part: "肩", symptom: "回外で痛み", answers: ["腱板炎", "滑液包炎", "広背筋短縮"] },
            { part: "肩", symptom: "スピードテスト陽性", answers: ["二頭筋長頭腱炎"] },
            { part: "肩", symptom: "ヤーガソンテスト陽性", answers: ["二頭筋腱炎"] },
            { part: "肩", symptom: "擦過音あり", answers: ["拘縮性肩関節炎", "腱板炎", "腱板部分断裂", "二頭筋長頭腱炎"] },
            { part: "肩", symptom: "自動挙上で痛み", answers: ["インピンジメント症候群"] },
            { part: "肩", symptom: "Apley内旋で痛み", answers: ["インピンジメント症候群", "腱板炎", "滑液包炎"] },
            { part: "肩", symptom: "Apley外旋で痛み", answers: ["腱板炎", "滑液包炎", "広背筋短縮"] },
            { part: "肩", symptom: "抵抗運動で痛み", answers: ["腱板炎", "滑液包炎"] },
            { part: "肩", symptom: "ジョブテストで改善（消失）", answers: ["棘上筋インピンジメント"] },
            { part: "肩", symptom: "棘上筋腱圧痛", answers: ["棘上筋障害"] },
            { part: "肩", symptom: "結節間溝圧痛", answers: ["二頭筋長頭腱炎"] },
            { part: "肩", symptom: "三角筋下圧痛", answers: ["三角筋下滑液包炎"] }
        ];

        let shuffledData = [];
        let index = 0;
        let selected = new Set();
        let score = 0;
        let isAnswered = false;

        function shuffle(arr) {
            return arr.sort(() => Math.random() - 0.5);
        }

        function getAllDiseasesForPart(part) {
            // 指定された部位のすべての疾患名を重複なく取得
            const diseases = new Set();
            quizData.forEach(q => {
                if (q.part === part) {
                    q.answers.forEach(disease => diseases.add(disease));
                }
            });
            return Array.from(diseases);
        }

        function show() {
            const q = shuffledData[index];
            isAnswered = false;

            document.getElementById("progress").innerText =
                (index + 1) + " / " + shuffledData.length;

            document.getElementById("body").innerText = q.part;
            document.getElementById("symptom").innerText = q.symptom;

            const choicesDiv = document.getElementById("choices");
            choicesDiv.innerHTML = "";

            // ボタンを「回答」に戻し、無効化
            const btn = document.getElementById("actionBtn");
            btn.innerText = "回答";
            btn.disabled = true;

            // 同じ部位のすべての疾患名を取得してシャッフル
            const allChoices = shuffle(getAllDiseasesForPart(q.part));

            allChoices.forEach(choice => {
                const div = document.createElement("div");
                div.innerText = choice;
                div.className = "choice";

                div.onclick = () => {
                    if (!isAnswered) {
                        if (selected.has(choice)) {
                            selected.delete(choice);
                            div.classList.remove("selected");
                        } else {
                            selected.add(choice);
                            div.classList.add("selected");
                        }
                        // 選択があればボタンを有効化
                        btn.disabled = selected.size === 0;
                    }
                };

                choicesDiv.appendChild(div);
            });
        }

        function handleAction() {
            if (!isAnswered) {
                // 回答フェーズ
                submit();
            } else {
                // 次へフェーズ
                next();
            }
        }

        function submit() {
            const q = shuffledData[index];
            const correct = new Set(q.answers);

            let ok = selected.size === correct.size &&
                [...selected].every(x => correct.has(x));

            if (ok) score++;

            document.querySelectorAll(".choice").forEach(div => {
                const text = div.innerText;

                if (correct.has(text)) {
                    if (selected.has(text)) div.classList.add("correct");
                    else div.classList.add("missed");
                } else if (selected.has(text)) {
                    div.classList.add("incorrect");
                }
                div.onclick = null;
            });

            selected.clear();
            isAnswered = true;

            // ボタンを「次へ」に変更
            const btn = document.getElementById("actionBtn");
            btn.innerText = "次へ";
            btn.disabled = false;
        }

        function next() {
            index++;
            if (index < shuffledData.length) {
                show();
            } else {
                // 終了時の処理
                document.getElementById("progress").style.display = "none";
                document.getElementById("body").style.display = "none";
                document.getElementById("symptom").style.display = "none";
                document.getElementById("choices").style.display = "none";
                document.getElementById("actionBtn").style.display = "none";
                
                document.getElementById("resultText").innerText =
                    "一周完了！ " + score + " / " + shuffledData.length + "問正解";
                document.getElementById("result").style.display = "block";
            }
        }

        function restart() {
            // シャッフルし直す
            shuffledData = shuffle([...quizData]);
            index = 0;
            score = 0;
            selected.clear();
            isAnswered = false;
            
            // 表示を元に戻す
            document.getElementById("progress").style.display = "block";
            document.getElementById("body").style.display = "block";
            document.getElementById("symptom").style.display = "block";
            document.getElementById("choices").style.display = "block";
            document.getElementById("actionBtn").style.display = "inline-block";
            document.getElementById("result").style.display = "none";
            
            show();
        }

        // 初期化: quizDataをシャッフルしてshuffledDataに格納
        shuffledData = shuffle([...quizData]);
        show();

    </script>

</body>

</html>
